name: ci
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  lint-typecheck:
    name: lint-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:cov

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bm_owner
          POSTGRES_PASSWORD: bm_owner_dev
          POSTGRES_DB: basamanager_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U bm_owner -d basamanager_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      mailpit:
        image: axllent/mailpit
        ports: ['1026:1025', '8026:8025']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start Redis with the test password (service containers cannot pass a command)
        run: |
          docker run -d --name redis-test -p 6380:6379 redis:7 redis-server --requirepass redis_dev
          for _ in $(seq 1 20); do docker exec redis-test redis-cli -a redis_dev --no-auth-warning ping | grep -q PONG && exit 0; sleep 1; done
          exit 1
      - name: Create DB roles (same script as the local compose)
        run: psql "postgresql://bm_owner:bm_owner_dev@localhost:5433/basamanager_test" -v ON_ERROR_STOP=1 -f infra/postgres/init/01-roles.sql
      - name: Test env
        run: cp .env.test.example .env.test
      - name: Migrations from zero + schema drift (schema.prisma must equal what the migrations build)
        # prisma.config.ts reads DATABASE_OWNER_URL (it loads only the root .env, not .env.test). The test suites
        # create their own throwaway databases, so migrating basamanager_test here doesn't affect them.
        env:
          DATABASE_OWNER_URL: postgresql://bm_owner:bm_owner_dev@localhost:5433/basamanager_test
        run: |
          pnpm --filter @bm/api db:migrate
          pnpm --filter @bm/api db:drift
      - run: pnpm test:int

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test env
        run: cp .env.test.example .env.test
      - name: Start test services
        run: docker compose -f infra/compose.test.yml up -d --wait
      - name: Apply migrations (the compose DB only has roles; the API needs the schema)
        env:
          DATABASE_OWNER_URL: postgresql://bm_owner:bm_owner_dev@localhost:5433/basamanager_test
        run: pnpm --filter @bm/api db:migrate
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      - run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
      - name: Stop test services
        if: always()
        run: docker compose -f infra/compose.test.yml down -v

  images:
    name: images (build + migrate)
    # Builds the api and worker images exactly as the deploy does and runs `prisma migrate deploy` inside the api
    # image as the unprivileged `node` user, so image problems (missing OpenSSL, root-owned /app) fail here and not on staging.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bm_owner
          POSTGRES_PASSWORD: bm_owner_dev
          POSTGRES_DB: basamanager_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U bm_owner -d basamanager_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the api image
        shell: bash # bash gives -eo pipefail, so a failed build is not hidden by `| tee`
        run: docker build -f infra/docker/api.Dockerfile -t bm-api:ci . 2>&1 | tee build-api.log
      - name: Build the worker image
        run: docker build -f infra/docker/worker.Dockerfile -t bm-worker:ci .
      - name: Prisma must have found OpenSSL while building
        run: "! grep -q 'failed to detect the libssl/openssl version' build-api.log"
      - name: Create DB roles (same script as the local compose)
        run: psql "postgresql://bm_owner:bm_owner_dev@localhost:5433/basamanager_test" -v ON_ERROR_STOP=1 -f infra/postgres/init/01-roles.sql
      - name: prisma migrate deploy inside the api image, as the node user
        run: |
          test "$(docker run --rm bm-api:ci id -un)" = node
          docker run --rm --network host -e DATABASE_OWNER_URL=postgres://bm_owner:bm_owner_dev@localhost:5433/basamanager_test bm-api:ci node_modules/.bin/prisma migrate deploy

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:check

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
