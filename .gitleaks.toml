title = "BasaManager gitleaks"

[extend]
useDefault = true

[allowlist]
description = "Dev/test-only values that are public by design"
paths = [
  '''^\.env\.example$''',
  '''^\.env\.test\.example$''',
  '''^infra/compose\.(dev|test)\.yml$''',
  '''^infra/postgres/init/.*\.sql$''',
  '''^apps/api/(src|test)/.*\.test\.ts$''', # fake JWT secrets and passwords in tests
]
