# One stack (postgres, redis, api, worker, web). Run twice on the VM as two projects, with different env files:
#   docker compose -p bm-staging --env-file /opt/basamanager/env/staging.env -f compose.server.yml up -d
#   docker compose -p bm-prod    --env-file /opt/basamanager/env/prod.env    -f compose.server.yml up -d
# Normally you never type these: infra/scripts/deploy.sh does. Variables come from the env file (see render-env.sh).
# Only the api and web containers join the shared "bm-edge" network, so Caddy can reach them. Postgres and Redis
# are on the private project network and publish NO ports to the host or the internet.
x-logging: &logging
  driver: json-file
  options: { max-size: 20m, max-file: '5' }

x-app-common: &app-common
  restart: unless-stopped
  logging: *logging
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  postgres:
    image: postgres:17.11@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
    restart: unless-stopped
    logging: *logging
    command: ['postgres', '-c', 'shared_buffers=128MB', '-c', 'max_connections=60']
    environment:
      POSTGRES_USER: bm_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bm_owner -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4.12@sha256:2e3eb11462c4e3759e6972678dd051d150ff54b1e60714b3c33b701260172a90
    restart: unless-stopped
    logging: *logging
    # The password comes from the environment so it does not show up in `ps` or `docker inspect` arguments.
    command:
      [
        'sh',
        '-c',
        'exec redis-server --requirepass "$${REDIS_PASSWORD}" --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction',
      ]
    volumes:
      - redisdata:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" --no-auth-warning ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    <<: *app-common
    image: ghcr.io/rhrony05/basamanager-api:${IMAGE_TAG:?}
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=384
      APP_ENV: ${APP_ENV:?}
      APP_URL: ${APP_URL:?}
      PORT: '4000'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://bm_app:${BM_APP_PASSWORD:?}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      COOKIE_SECURE: 'true'
      JWT_SECRET: ${JWT_SECRET:?}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      STORAGE_DRIVER: cloudinary
      STORAGE_URL_SECRET: ${STORAGE_URL_SECRET:?}
      STORAGE_FOLDER: ${STORAGE_FOLDER:?}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      SSLCOMMERZ_STORE_ID: ${SSLCOMMERZ_STORE_ID:-}
      SSLCOMMERZ_STORE_PASSWORD: ${SSLCOMMERZ_STORE_PASSWORD:-}
      SSLCOMMERZ_SANDBOX: 'true'
      PAYMENTS_MOCK: 'false'
      SENTRY_DSN_API: ${SENTRY_DSN_API:-}
      SENTRY_DSN_WEB: ${SENTRY_DSN_WEB:-}
      SENTRY_RELEASE: ${IMAGE_TAG}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
    networks:
      default: {}
      edge:
        aliases: ['${ENV_NAME:?}-api']

  worker:
    <<: *app-common
    image: ghcr.io/rhrony05/basamanager-worker:${IMAGE_TAG:?}
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=384
      APP_ENV: ${APP_ENV:?}
      APP_URL: ${APP_URL:?}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://bm_worker:${BM_WORKER_PASSWORD:?}@postgres:5432/${POSTGRES_DB}
      DATABASE_WORKER_URL: postgresql://bm_worker:${BM_WORKER_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      COOKIE_SECURE: 'true'
      STORAGE_DRIVER: cloudinary
      STORAGE_URL_SECRET: ${STORAGE_URL_SECRET:?}
      STORAGE_FOLDER: ${STORAGE_FOLDER:?}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      SSLCOMMERZ_SANDBOX: 'true'
      PAYMENTS_MOCK: 'false'
      SENTRY_DSN_WORKER: ${SENTRY_DSN_WORKER:-}
      SENTRY_RELEASE: ${IMAGE_TAG}

  web:
    image: ghcr.io/rhrony05/basamanager-web:${IMAGE_TAG:?}
    restart: unless-stopped
    logging: *logging
    networks:
      default: {}
      edge:
        aliases: ['${ENV_NAME}-web']

  # One-off: `docker compose run --rm migrate`. Uses the owner role; the running api never gets this URL.
  migrate:
    image: ghcr.io/rhrony05/basamanager-api:${IMAGE_TAG:?}
    profiles: ['tools']
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_OWNER_URL: postgresql://bm_owner:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: ['node_modules/.bin/prisma', 'migrate', 'deploy']

volumes:
  pgdata:
  redisdata:

networks:
  edge:
    name: bm-edge
    external: true
