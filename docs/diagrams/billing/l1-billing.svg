<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 800" width="1700" height="800" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f1f1f"/>
    </marker>
  </defs>
  <rect width="1700" height="800" fill="#ffffff"/>
  <text x="40" y="52" font-size="28" font-weight="700" fill="#1f1f1f">Billing Engine, level 1: Subprocesses &amp; Dataflow</text>
  <text x="40" y="82" font-size="16" fill="#3a3a3a">Step-by-step pipeline from generation to meter readings, issue, credit deduction, and late fee processing.</text>
  <g font-size="15" fill="#3a3a3a">
    <line x1="1130" y1="36" x2="1190" y2="36" stroke="#1f1f1f" stroke-width="2.4" marker-end="url(#arrow)"/>
    <text x="1202" y="41">call / read</text>
    <line x1="1130" y1="62" x2="1190" y2="62" stroke="#1f1f1f" stroke-width="2.4" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
    <text x="1202" y="67">write / return</text>
    <rect x="1370" y="24" width="26" height="18" rx="3" fill="#FEC8C3"/><text x="1406" y="39">people / external</text>
    <rect x="1530" y="24" width="26" height="18" rx="7" fill="#BFE3FD"/><text x="1566" y="39">our code</text>
    <circle cx="1383" cy="62" r="9" fill="#E3CCFD"/><text x="1406" y="67">data store</text>
    <rect x="1530" y="53" width="26" height="18" rx="3" fill="#C9F2D6"/><text x="1566" y="67">output</text>
  </g>
  <g fill="none" stroke="#1f1f1f" stroke-width="2.4">
    <!-- Pipeline flow arrows -->
    <path d="M330,370 H400" marker-end="url(#arrow)"/>
    <path d="M680,370 H750" marker-end="url(#arrow)"/>
    <path d="M1030,370 H1100" marker-end="url(#arrow)"/>
    <path d="M1380,370 H1450" marker-end="url(#arrow)"/>
    <!-- DB connections -->
    <path d="M220,440 V580" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
    <path d="M540,440 V580" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
    <path d="M890,440 V580" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
    <path d="M1240,440 V580" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
  </g>

  <!-- Step 1: Draft Generation -->
  <rect x="50" y="300" width="280" height="140" rx="8" fill="#BFE3FD" stroke="#1f1f1f" stroke-width="1.5"/>
  <text x="190" y="335" font-size="18" font-weight="700" fill="#1f1f1f" text-anchor="middle">1. Draft Generation</text>
  <text x="190" y="365" font-size="13" fill="#3a3a3a" text-anchor="middle">Daily worker / Landlord click</text>
  <text x="190" y="385" font-size="13" fill="#3a3a3a" text-anchor="middle">Active lease rent proration</text>
  <text x="190" y="405" font-size="13" fill="#3a3a3a" text-anchor="middle">Fixed recurring charges</text>
  <text x="190" y="425" font-size="13" fill="#3a3a3a" text-anchor="middle">Flag needs_reading for submeters</text>

  <!-- Step 2: Readings Entry -->
  <rect x="400" y="300" width="280" height="140" rx="8" fill="#BFE3FD" stroke="#1f1f1f" stroke-width="1.5"/>
  <text x="540" y="335" font-size="18" font-weight="700" fill="#1f1f1f" text-anchor="middle">2. Readings &amp; Power</text>
  <text x="540" y="365" font-size="13" fill="#3a3a3a" text-anchor="middle">Caretaker/Landlord grid entry</text>
  <text x="540" y="385" font-size="13" fill="#3a3a3a" text-anchor="middle">Check reading >= prev reading</text>
  <text x="540" y="405" font-size="13" fill="#3a3a3a" text-anchor="middle">Support meter replacement</text>
  <text x="540" y="425" font-size="13" fill="#3a3a3a" text-anchor="middle">Update electricity bill line</text>

  <!-- Step 3: Bill Issuance -->
  <rect x="750" y="300" width="280" height="140" rx="8" fill="#BFE3FD" stroke="#1f1f1f" stroke-width="1.5"/>
  <text x="890" y="335" font-size="18" font-weight="700" fill="#1f1f1f" text-anchor="middle">3. Bill Issuance</text>
  <text x="890" y="365" font-size="13" fill="#3a3a3a" text-anchor="middle">Single or batch issue ready</text>
  <text x="890" y="385" font-size="13" fill="#3a3a3a" text-anchor="middle">Block if reading is missing</text>
  <text x="890" y="405" font-size="13" fill="#3a3a3a" text-anchor="middle">Auto-apply credit balance</text>
  <text x="890" y="425" font-size="13" fill="#3a3a3a" text-anchor="middle">Queue bill.issued outbox event</text>

  <!-- Step 4: Late Fee Application -->
  <rect x="1100" y="300" width="280" height="140" rx="8" fill="#BFE3FD" stroke="#1f1f1f" stroke-width="1.5"/>
  <text x="1240" y="335" font-size="18" font-weight="700" fill="#1f1f1f" text-anchor="middle">4. Late Fees</text>
  <text x="1240" y="365" font-size="13" fill="#3a3a3a" text-anchor="middle">Daily worker at 00:20 Dhaka</text>
  <text x="1240" y="385" font-size="13" fill="#3a3a3a" text-anchor="middle">Check due_date + grace_days</text>
  <text x="1240" y="405" font-size="13" fill="#3a3a3a" text-anchor="middle">Fixed or percent daily rate</text>
  <text x="1240" y="425" font-size="13" fill="#3a3a3a" text-anchor="middle">Add late_fee line item</text>

  <!-- Result: Output -->
  <rect x="1450" y="300" width="210" height="140" rx="8" fill="#C9F2D6" stroke="#1f1f1f" stroke-width="1.5"/>
  <text x="1555" y="335" font-size="18" font-weight="700" fill="#1f1f1f" text-anchor="middle">Final Bill State</text>
  <text x="1555" y="365" font-size="13" fill="#3a3a3a" text-anchor="middle">Issued / Overdue</text>
  <text x="1555" y="385" font-size="13" fill="#3a3a3a" text-anchor="middle">Full line item audit</text>
  <text x="1555" y="405" font-size="13" fill="#3a3a3a" text-anchor="middle">Ready for payment</text>
  <text x="1555" y="425" font-size="13" fill="#3a3a3a" text-anchor="middle">Landlord waiver available</text>

  <!-- Shared Postgres DB -->
  <circle cx="890" cy="650" r="55" fill="#E3CCFD"/>
  <text x="890" y="645" font-size="18" font-weight="700" fill="#1f1f1f" text-anchor="middle">Postgres DB</text>
  <text x="890" y="670" font-size="13" fill="#3a3a3a" text-anchor="middle">bills, bill_lines, meter_readings, credit_entries</text>
</svg>
