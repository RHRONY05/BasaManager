<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 800" width="1700" height="800" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f1f1f"/>
    </marker>
  </defs>
  <rect width="1700" height="800" fill="#ffffff"/>
  <text x="40" y="52" font-size="28" font-weight="700" fill="#1f1f1f">Billing Engine, level 0</text>
  <text x="40" y="82" font-size="16" fill="#3a3a3a">Monthly draft generation, meter reading entry, proration, bill issuance with automatic credit application, and dues tracking.</text>
  <g font-size="15" fill="#3a3a3a">
    <line x1="1130" y1="36" x2="1190" y2="36" stroke="#1f1f1f" stroke-width="2.4" marker-end="url(#arrow)"/>
    <text x="1202" y="41">call / read</text>
    <line x1="1130" y1="62" x2="1190" y2="62" stroke="#1f1f1f" stroke-width="2.4" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
    <text x="1202" y="67">write / return</text>
    <rect x="1370" y="24" width="26" height="18" rx="3" fill="#FEC8C3"/><text x="1406" y="39">people / external</text>
    <rect x="1530" y="24" width="26" height="18" rx="7" fill="#BFE3FD"/><text x="1566" y="39">our code</text>
    <circle cx="1383" cy="62" r="9" fill="#E3CCFD"/><text x="1406" y="67">data store</text>
    <rect x="1530" y="53" width="26" height="18" rx="3" fill="#C9F2D6"/><text x="1566" y="67">output</text>
  </g>
  <g fill="none" stroke="#1f1f1f" stroke-width="2.4">
    <path d="M250,300 H520" marker-end="url(#arrow)"/>
    <path d="M520,340 H250" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
    <path d="M250,450 H520" marker-end="url(#arrow)"/>
    <path d="M520,490 H250" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
    <path d="M250,600 H520" marker-end="url(#arrow)"/>
    <path d="M520,640 H250" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
    <path d="M1090,460 H1380" marker-end="url(#arrow)"/>
    <path d="M780,630 V680" marker-end="url(#arrow)"/>
    <path d="M860,680 V630" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
  </g>
  <rect x="40" y="240" width="210" height="130" rx="6" fill="#FEC8C3"/>
  <text x="145" y="285" font-size="20" font-weight="700" fill="#1f1f1f" text-anchor="middle">Landlord</text>
  <text x="145" y="315" font-size="15" fill="#3a3a3a" text-anchor="middle">draft generation</text>
  <text x="145" y="337" font-size="15" fill="#3a3a3a" text-anchor="middle">issue &amp; adjust bills</text>
  <text x="385" y="290" font-size="15" fill="#1f1f1f" text-anchor="middle">generate / issue / waive</text>
  <text x="385" y="365" font-size="15" fill="#1f1f1f" text-anchor="middle">bills &amp; financial summary</text>

  <rect x="40" y="390" width="210" height="130" rx="6" fill="#FEC8C3"/>
  <text x="145" y="435" font-size="20" font-weight="700" fill="#1f1f1f" text-anchor="middle">Caretaker</text>
  <text x="145" y="465" font-size="15" fill="#3a3a3a" text-anchor="middle">mobile readings grid</text>
  <text x="145" y="487" font-size="15" fill="#3a3a3a" text-anchor="middle">assigned buildings only</text>
  <text x="385" y="440" font-size="15" fill="#1f1f1f" text-anchor="middle">enter meter readings</text>
  <text x="385" y="515" font-size="15" fill="#1f1f1f" text-anchor="middle">saved reading status</text>

  <rect x="40" y="540" width="210" height="130" rx="6" fill="#FEC8C3"/>
  <text x="145" y="585" font-size="20" font-weight="700" fill="#1f1f1f" text-anchor="middle">Tenant</text>
  <text x="145" y="615" font-size="15" fill="#3a3a3a" text-anchor="middle">mobile-first PWA</text>
  <text x="145" y="637" font-size="15" fill="#3a3a3a" text-anchor="middle">/t/bills &amp; /t/dues</text>
  <text x="385" y="590" font-size="15" fill="#1f1f1f" text-anchor="middle">get bills &amp; total dues</text>
  <text x="385" y="665" font-size="15" fill="#1f1f1f" text-anchor="middle">explained bill &amp; balance</text>

  <rect x="520" y="230" width="570" height="400" rx="12" fill="#BFE3FD"/>
  <text x="805" y="275" font-size="24" font-weight="700" fill="#1f1f1f" text-anchor="middle">BasaManager Billing Engine</text>
  <text x="805" y="305" font-size="15" fill="#3a3a3a" text-anchor="middle">apps/api: billing.service.ts · apps/worker: generateBills, applyLateFees</text>
  <text x="805" y="325" font-size="15" fill="#3a3a3a" text-anchor="middle">packages/domain: pure billing logic (proration, electricity, late fees, credit)</text>

  <rect x="550" y="350" width="240" height="110" rx="8" fill="#ffffff" stroke="#1f1f1f" stroke-width="1.5"/>
  <text x="670" y="380" font-size="16" font-weight="700" fill="#1f1f1f" text-anchor="middle">Draft Generation</text>
  <text x="670" y="405" font-size="13" fill="#3a3a3a" text-anchor="middle">Idempotent monthly run</text>
  <text x="670" y="425" font-size="13" fill="#3a3a3a" text-anchor="middle">Lease proration &amp; charges</text>
  <text x="670" y="445" font-size="13" fill="#3a3a3a" text-anchor="middle">Submeter detection</text>

  <rect x="820" y="350" width="240" height="110" rx="8" fill="#ffffff" stroke="#1f1f1f" stroke-width="1.5"/>
  <text x="940" y="380" font-size="16" font-weight="700" fill="#1f1f1f" text-anchor="middle">Readings &amp; Power</text>
  <text x="940" y="405" font-size="13" fill="#3a3a3a" text-anchor="middle">Grid entry &amp; rollover</text>
  <text x="940" y="425" font-size="13" fill="#3a3a3a" text-anchor="middle">Meter replacement support</text>
  <text x="940" y="445" font-size="13" fill="#3a3a3a" text-anchor="middle">Live bill line updates</text>

  <rect x="550" y="480" width="240" height="110" rx="8" fill="#ffffff" stroke="#1f1f1f" stroke-width="1.5"/>
  <text x="670" y="510" font-size="16" font-weight="700" fill="#1f1f1f" text-anchor="middle">Issue &amp; Credit</text>
  <text x="670" y="535" font-size="13" fill="#3a3a3a" text-anchor="middle">Reading completion check</text>
  <text x="670" y="555" font-size="13" fill="#3a3a3a" text-anchor="middle">Auto-apply credit balance</text>
  <text x="670" y="575" font-size="13" fill="#3a3a3a" text-anchor="middle">Transactional outbox event</text>

  <rect x="820" y="480" width="240" height="110" rx="8" fill="#ffffff" stroke="#1f1f1f" stroke-width="1.5"/>
  <text x="940" y="510" font-size="16" font-weight="700" fill="#1f1f1f" text-anchor="middle">Late Fees &amp; Adjustments</text>
  <text x="940" y="535" font-size="13" fill="#3a3a3a" text-anchor="middle">Daily cron past grace days</text>
  <text x="940" y="555" font-size="13" fill="#3a3a3a" text-anchor="middle">Landlord waiver workflow</text>
  <text x="940" y="575" font-size="13" fill="#3a3a3a" text-anchor="middle">Audited signed adjustments</text>

  <circle cx="820" cy="730" r="45" fill="#E3CCFD"/>
  <text x="820" y="725" font-size="15" font-weight="700" fill="#1f1f1f" text-anchor="middle">Postgres DB</text>
  <text x="820" y="745" font-size="12" fill="#3a3a3a" text-anchor="middle">RLS isolated</text>

  <rect x="1380" y="380" width="270" height="150" rx="6" fill="#C9F2D6"/>
  <text x="1515" y="420" font-size="18" font-weight="700" fill="#1f1f1f" text-anchor="middle">Financial Artefacts</text>
  <text x="1515" y="450" font-size="14" fill="#3a3a3a" text-anchor="middle">Explained bill breakdown</text>
  <text x="1515" y="475" font-size="14" fill="#3a3a3a" text-anchor="middle">Outbox: bill.issued events</text>
  <text x="1515" y="500" font-size="14" fill="#3a3a3a" text-anchor="middle">Real-time tenant dues summary</text>
</svg>
