<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 850" width="1700" height="850" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f1f1f"/>
    </marker>
  </defs>
  <rect width="1700" height="850" fill="#ffffff"/>
  <text x="40" y="52" font-size="28" font-weight="700" fill="#1f1f1f">Payments Engine, level 1: Subprocesses &amp; Dataflow</text>
  <text x="40" y="82" font-size="16" fill="#3a3a3a">Step-by-step transition from tenant claim submission through staff verification, Rule 5 waterfall allocation, and landlord voiding.</text>

  <!-- Step 1: Claim Submission -->
  <rect x="50" y="150" width="350" height="320" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="70" y="170" width="160" height="30" rx="6" fill="#BFE3FD"/>
  <text x="150" y="190" font-size="14" font-weight="700" fill="#1f1f1f" text-anchor="middle">1. Claim Submission</text>
  <text x="70" y="230" font-size="13" font-weight="600" fill="#0f172a">POST /api/payments/claims</text>
  <text x="70" y="255" font-size="12" fill="#475569">• Tenant submits amount, method, ref</text>
  <text x="70" y="275" font-size="12" fill="#475569">• Duplicate reference check for bkash/nagad</text>
  <text x="70" y="295" font-size="12" fill="#475569">• Optional proof attachment via /files</text>
  <text x="70" y="325" font-size="13" font-weight="600" fill="#0f172a">Database writes:</text>
  <text x="70" y="350" font-size="12" fill="#475569">• payments (status: pending_claim)</text>
  <text x="70" y="370" font-size="12" fill="#475569">• outbox (payment.claim_submitted)</text>
  <text x="70" y="405" font-size="12" font-style="italic" fill="#0284c7">Allocates nothing to bills yet</text>

  <!-- Step 2: Verification / Direct Entry -->
  <rect x="440" y="150" width="370" height="320" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="460" y="170" width="190" height="30" rx="6" fill="#BFE3FD"/>
  <text x="555" y="190" font-size="14" font-weight="700" fill="#1f1f1f" text-anchor="middle">2. Confirm / Direct Record</text>
  <text x="460" y="230" font-size="13" font-weight="600" fill="#0f172a">POST /payments/:id/confirm or /payments</text>
  <text x="460" y="255" font-size="12" fill="#475569">• Caretaker / Landlord role verification</text>
  <text x="460" y="275" font-size="12" fill="#475569">• Caretaker building assignment checked</text>
  <text x="460" y="300" font-size="13" font-weight="600" fill="#0f172a">Atomic Transaction:</text>
  <text x="460" y="325" font-size="12" fill="#475569">• Lock lease row (FOR UPDATE)</text>
  <text x="460" y="345" font-size="12" fill="#475569">• Lock unpaid bills (ORDER BY month ASC)</text>
  <text x="460" y="365" font-size="12" fill="#475569">• Increment receipt_counters (ON CONFLICT)</text>
  <text x="460" y="385" font-size="12" fill="#475569">• INSERT INTO receipts (BM-year-seq)</text>
  <text x="460" y="415" font-size="12" font-style="italic" fill="#0284c7">Proceeds to Rule 5 Allocation</text>

  <!-- Step 3: Rule 5 Waterfall Allocation -->
  <rect x="850" y="150" width="390" height="320" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="870" y="170" width="190" height="30" rx="6" fill="#BFE3FD"/>
  <text x="965" y="190" font-size="14" font-weight="700" fill="#1f1f1f" text-anchor="middle">3. Rule 5 Allocation &amp; Credit</text>
  <text x="870" y="230" font-size="13" font-weight="600" fill="#0f172a">Ordered Bill Waterfall:</text>
  <text x="870" y="255" font-size="12" fill="#475569">• Oldest unpaid bill filled first</text>
  <text x="870" y="275" font-size="12" fill="#475569">• Remaining overflows to next unpaid bill</text>
  <text x="870" y="295" font-size="12" fill="#475569">• Each fill: INSERT payment_allocations</text>
  <text x="870" y="315" font-size="12" fill="#475569">• Updates bill.paid_poisha &amp; status</text>
  <text x="870" y="345" font-size="13" font-weight="600" fill="#0f172a">Surplus / Overpayment:</text>
  <text x="870" y="370" font-size="12" fill="#475569">• Any remainder becomes credit_entries</text>
  <text x="870" y="390" font-size="12" fill="#475569">• kind: 'overpayment', amount &gt; 0</text>
  <text x="870" y="415" font-size="12" font-style="italic" fill="#0284c7">Auto-applied to next issued bill (B3)</text>

  <!-- Step 4: Rule 6 Voiding -->
  <rect x="1280" y="150" width="370" height="320" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="1300" y="170" width="160" height="30" rx="6" fill="#FEC8C3"/>
  <text x="1380" y="190" font-size="14" font-weight="700" fill="#1f1f1f" text-anchor="middle">4. Rule 6 Voiding</text>
  <text x="1300" y="230" font-size="13" font-weight="600" fill="#0f172a">POST /api/payments/:id/void</text>
  <text x="1300" y="255" font-size="12" fill="#475569">• Landlord only (caretaker forbidden 403)</text>
  <text x="1300" y="275" font-size="12" fill="#475569">• Requires non-empty audit void reason</text>
  <text x="1300" y="300" font-size="13" font-weight="600" fill="#0f172a">Reversal Mechanics:</text>
  <text x="1300" y="325" font-size="12" fill="#475569">• app_void_payment removes allocations</text>
  <text x="1300" y="345" font-size="12" fill="#475569">• Receipt status marked 'void'</text>
  <text x="1300" y="365" font-size="12" fill="#475569">• Unwinds credit used on later bills</text>
  <text x="1300" y="385" font-size="12" fill="#475569">• Recomputed affected bills to issued</text>
  <text x="1300" y="415" font-size="12" font-style="italic" fill="#991b1b">Immutable history preserved via procedure</text>

  <!-- Arrows between steps -->
  <path d="M400,310 H440" stroke="#1f1f1f" stroke-width="2.4" marker-end="url(#arrow)"/>
  <path d="M810,310 H850" stroke="#1f1f1f" stroke-width="2.4" marker-end="url(#arrow)"/>
  <path d="M1240,310 H1280" stroke="#1f1f1f" stroke-width="2.4" marker-end="url(#arrow)"/>

  <!-- Database Isolation Layer -->
  <rect x="50" y="520" width="1600" height="280" rx="12" fill="#E3CCFD" opacity="0.3"/>
  <text x="850" y="555" font-size="20" font-weight="700" fill="#1f1f1f" text-anchor="middle">PostgreSQL Database Schema &amp; Storage Architecture</text>

  <rect x="80" y="580" width="350" height="190" rx="8" fill="#ffffff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="255" y="610" font-size="15" font-weight="700" fill="#1f1f1f" text-anchor="middle">payments &amp; receipts</text>
  <text x="100" y="640" font-size="12" fill="#334155">• id, org_id, lease_id, amount_poisha</text>
  <text x="100" y="660" font-size="12" fill="#334155">• status: pending_claim / confirmed / rejected / void</text>
  <text x="100" y="680" font-size="12" fill="#334155">• receipt_counters: (org_id, year) ➔ last_seq</text>
  <text x="100" y="700" font-size="12" fill="#334155">• receipts: (org_id, number) UNIQUE</text>
  <text x="100" y="720" font-size="12" fill="#334155">• REVOKE DELETE FROM bm_app (audit log)</text>

  <rect x="470" y="580" width="350" height="190" rx="8" fill="#ffffff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="645" y="610" font-size="15" font-weight="700" fill="#1f1f1f" text-anchor="middle">payment_allocations</text>
  <text x="490" y="640" font-size="12" fill="#334155">• id, org_id, payment_id, bill_id, amount_poisha</text>
  <text x="490" y="665" font-size="12" fill="#334155">• Connects payments to bills</text>
  <text x="490" y="690" font-size="12" fill="#334155">• Σ amount_poisha per bill = bills.paid_poisha</text>
  <text x="490" y="715" font-size="12" fill="#334155">• Deleted only via app_void_payment function</text>

  <rect x="860" y="580" width="360" height="190" rx="8" fill="#ffffff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="1040" y="610" font-size="15" font-weight="700" fill="#1f1f1f" text-anchor="middle">credit_entries</text>
  <text x="880" y="640" font-size="12" fill="#334155">• id, org_id, lease_id, amount_poisha (signed)</text>
  <text x="880" y="665" font-size="12" fill="#334155">• kind: 'overpayment' (+), 'applied' (-), 'reversed' (+)</text>
  <text x="880" y="690" font-size="12" fill="#334155">• Lease credit balance = Σ amount_poisha &gt;= 0</text>
  <text x="880" y="715" font-size="12" fill="#334155">• Overpayment credit deleted upon void</text>

  <rect x="1260" y="580" width="360" height="190" rx="8" fill="#ffffff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="1440" y="610" font-size="15" font-weight="700" fill="#1f1f1f" text-anchor="middle">files &amp; storage</text>
  <text x="1280" y="640" font-size="12" fill="#334155">• StorageDriver: LocalStorageDriver / Cloudinary</text>
  <text x="1280" y="665" font-size="12" fill="#334155">• Magic byte sniffing: JPEG / PNG / WebP / PDF</text>
  <text x="1280" y="690" font-size="12" fill="#334155">• 5 MB limit enforced via multer memory</text>
  <text x="1280" y="715" font-size="12" fill="#334155">• HMAC-signed expiring URLs (exp, sig)</text>
</svg>
