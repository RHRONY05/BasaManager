<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 800" width="1700" height="800" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f1f1f"/>
    </marker>
  </defs>
  <rect width="1700" height="800" fill="#ffffff"/>
  <text x="40" y="52" font-size="28" font-weight="700" fill="#1f1f1f">Organisations &amp; staff, level 2: Caretaker Building Scope &amp; Real-time Rooms</text>
  <text x="40" y="82" font-size="16" fill="#3a3a3a">When a caretaker's buildings change, membership row is updated, caretaker_buildings links synced, and sockets re-joined to building rooms.</text>
  <g fill="none" stroke="#1f1f1f" stroke-width="2.4">
    <path d="M260,380 H350" marker-end="url(#arrow)"/>
    <path d="M630,380 H720" marker-end="url(#arrow)"/>
    <path d="M1000,340 H1100" marker-end="url(#arrow)"/>
    <path d="M1000,420 H1100" marker-end="url(#arrow)"/>
  </g>
  <rect x="40" y="320" width="220" height="120" rx="6" fill="#FEC8C3"/>
  <text x="150" y="370" font-size="18" font-weight="700" fill="#1f1f1f" text-anchor="middle">Landlord Action</text>
  <text x="150" y="400" font-size="14" fill="#3a3a3a" text-anchor="middle">PUT .../buildings</text>
  <rect x="350" y="300" width="280" height="160" rx="6" fill="#FFF1B8"/>
  <text x="490" y="345" font-size="18" font-weight="700" fill="#1f1f1f" text-anchor="middle">Validation &amp; Verification</text>
  <text x="490" y="375" font-size="13" fill="#3a3a3a" text-anchor="middle">1. Target role must be caretaker</text>
  <text x="490" y="400" font-size="13" fill="#3a3a3a" text-anchor="middle">2. All building IDs belong to org</text>
  <text x="490" y="425" font-size="13" fill="#3a3a3a" text-anchor="middle">3. Non-caretaker is rejected (400)</text>
  <rect x="720" y="270" width="280" height="220" rx="6" fill="#BFE3FD"/>
  <text x="860" y="315" font-size="18" font-weight="700" fill="#1f1f1f" text-anchor="middle">Database Transaction</text>
  <text x="860" y="350" font-size="13" fill="#3a3a3a" text-anchor="middle">DELETE old caretaker_buildings</text>
  <text x="860" y="380" font-size="13" fill="#3a3a3a" text-anchor="middle">INSERT new caretaker_buildings</text>
  <text x="860" y="410" font-size="13" fill="#3a3a3a" text-anchor="middle">Atomically committed</text>
  <rect x="1100" y="280" width="260" height="100" rx="6" fill="#C9F2D6"/>
  <text x="1230" y="325" font-size="18" font-weight="700" fill="#1f1f1f" text-anchor="middle">Socket Re-join</text>
  <text x="1230" y="355" font-size="13" fill="#3a3a3a" text-anchor="middle">User sockets join building rooms</text>
  <rect x="1100" y="400" width="260" height="100" rx="6" fill="#C9F2D6"/>
  <text x="1230" y="445" font-size="18" font-weight="700" fill="#1f1f1f" text-anchor="middle">Scaped Access</text>
  <text x="1230" y="475" font-size="13" fill="#3a3a3a" text-anchor="middle">Caretaker sees only new buildings</text>
</svg>
