<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 800" width="1700" height="800" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f1f1f"/>
    </marker>
  </defs>
  <rect width="1700" height="800" fill="#ffffff"/>
  <text x="40" y="52" font-size="28" font-weight="700" fill="#1f1f1f">Organisations &amp; staff, level 0</text>
  <text x="40" y="82" font-size="16" fill="#3a3a3a">Multi-tenant boundary: landlords manage their organisation, invite staff caretakers, and assign them building permissions.</text>
  <g font-size="15" fill="#3a3a3a">
    <line x1="1130" y1="36" x2="1190" y2="36" stroke="#1f1f1f" stroke-width="2.4" marker-end="url(#arrow)"/>
    <text x="1202" y="41">call / read</text>
    <line x1="1130" y1="62" x2="1190" y2="62" stroke="#1f1f1f" stroke-width="2.4" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
    <text x="1202" y="67">write / return</text>
    <rect x="1370" y="24" width="26" height="18" rx="3" fill="#FEC8C3"/><text x="1406" y="39">people / external</text>
    <rect x="1530" y="24" width="26" height="18" rx="7" fill="#BFE3FD"/><text x="1566" y="39">our code</text>
    <circle cx="1383" cy="62" r="9" fill="#E3CCFD"/><text x="1406" y="67">data store</text>
    <rect x="1530" y="53" width="26" height="18" rx="3" fill="#C9F2D6"/><text x="1566" y="67">output</text>
  </g>
  <g fill="none" stroke="#1f1f1f" stroke-width="2.4">
    <path d="M240,400 H514" marker-end="url(#arrow)"/>
    <path d="M514,440 H244" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
    <path d="M1084,360 H1374" marker-end="url(#arrow)"/>
    <path d="M740,552 V622" marker-end="url(#arrow)"/>
    <path d="M860,622 V554" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
  </g>
  <rect x="40" y="340" width="200" height="130" rx="6" fill="#FEC8C3"/>
  <text x="140" y="387" font-size="20" font-weight="700" fill="#1f1f1f" text-anchor="middle">Landlord &amp; Staff</text>
  <text x="140" y="417" font-size="15" fill="#3a3a3a" text-anchor="middle">web client / PWA</text>
  <text x="140" y="439" font-size="15" fill="#3a3a3a" text-anchor="middle">X-Org-Id context</text>
  <text x="377" y="388" font-size="16" fill="#1f1f1f" text-anchor="middle">API requests &amp; invites</text>
  <text x="377" y="466" font-size="16" fill="#1f1f1f" text-anchor="middle">members, scope, status</text>
  <rect x="520" y="250" width="560" height="300" rx="56" fill="#BFE3FD"/>
  <text x="800" y="330" font-size="24" font-weight="700" fill="#1f1f1f" text-anchor="middle">Organisation &amp; Staff Service</text>
  <text x="800" y="365" font-size="15" fill="#3a3a3a" text-anchor="middle">verify landlord role (requireRole)</text>
  <text x="800" y="390" font-size="15" fill="#3a3a3a" text-anchor="middle">org details &amp; rename (PATCH /api/org)</text>
  <text x="800" y="415" font-size="15" fill="#3a3a3a" text-anchor="middle">list members &amp; roles (GET /api/org/members)</text>
  <text x="800" y="440" font-size="15" fill="#3a3a3a" text-anchor="middle">send / revoke caretaker invites</text>
  <text x="800" y="465" font-size="15" fill="#3a3a3a" text-anchor="middle">assign caretaker buildings (PUT .../buildings)</text>
  <text x="800" y="490" font-size="15" fill="#3a3a3a" text-anchor="middle">remove caretaker staff (DELETE .../members/:id)</text>
  <rect x="1380" y="320" width="220" height="90" rx="6" fill="#FEC8C3"/>
  <text x="1490" y="358" font-size="20" font-weight="700" fill="#1f1f1f" text-anchor="middle">Caretaker Email</text>
  <text x="1490" y="388" font-size="15" fill="#3a3a3a" text-anchor="middle">outbox invite.sent</text>
  <text x="1230" y="348" font-size="16" fill="#1f1f1f" text-anchor="middle">invite link email</text>
  <circle cx="800" cy="690" r="68" fill="#E3CCFD"/>
  <text x="800" y="685" font-size="18" font-weight="700" fill="#1f1f1f" text-anchor="middle">Postgres 17</text>
  <text x="800" y="707" font-size="14" fill="#3a3a3a" text-anchor="middle">organizations, memberships,</text>
  <text x="800" y="725" font-size="14" fill="#3a3a3a" text-anchor="middle">caretaker_buildings, invitations</text>
</svg>
