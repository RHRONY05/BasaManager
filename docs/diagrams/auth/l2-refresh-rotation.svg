<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 800" width="1700" height="800" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f1f1f"/>
    </marker>
  </defs>
  <rect width="1700" height="800" fill="#ffffff"/>
  <text x="40" y="52" font-size="28" font-weight="700" fill="#1f1f1f">Refresh rotation, level 2</text>
  <text x="40" y="82" font-size="16" fill="#3a3a3a">What POST /api/auth/refresh does with the bm_rt cookie, and why an old token sets off the alarm.</text>
  <g font-size="15" fill="#3a3a3a">
    <line x1="1130" y1="36" x2="1190" y2="36" stroke="#1f1f1f" stroke-width="2.4" marker-end="url(#arrow)"/>
    <text x="1202" y="41">call / read</text>
    <line x1="1130" y1="62" x2="1190" y2="62" stroke="#1f1f1f" stroke-width="2.4" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
    <text x="1202" y="67">write / return</text>
    <rect x="1370" y="24" width="26" height="18" rx="3" fill="#FEC8C3"/><text x="1406" y="39">people / external</text>
    <rect x="1530" y="24" width="26" height="18" rx="7" fill="#BFE3FD"/><text x="1566" y="39">our code</text>
    <circle cx="1383" cy="62" r="9" fill="#E3CCFD"/><text x="1406" y="67">data store</text>
    <rect x="1530" y="53" width="26" height="18" rx="3" fill="#C9F2D6"/><text x="1566" y="67">output</text>
    <rect x="1370" y="80" width="26" height="18" rx="3" fill="#FFF1B8"/><text x="1406" y="95">guard / decision</text>
  </g>
  <g fill="none" stroke="#1f1f1f" stroke-width="2.4">
    <path d="M200,375 H266" marker-end="url(#arrow)"/>
    <path d="M520,375 H596" marker-end="url(#arrow)"/>
    <path d="M870,375 H946" marker-end="url(#arrow)"/>
    <path d="M395,450 V562" marker-end="url(#arrow)"/>
    <path d="M735,440 V536" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
    <path d="M1190,350 H1240 V190 H1286" marker-end="url(#arrow)"/>
    <path d="M1190,400 H1240 V600 H1286" marker-end="url(#arrow)"/>
    <path d="M1455,260 V316" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
    <path d="M1455,530 V474" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
  </g>
  <rect x="30" y="330" width="170" height="90" rx="6" fill="#FEC8C3"/>
  <text x="115" y="368" font-size="20" font-weight="700" fill="#1f1f1f" text-anchor="middle">Browser</text>
  <text x="115" y="398" font-size="15" fill="#3a3a3a" text-anchor="middle">sends bm_rt cookie</text>
  <rect x="270" y="300" width="250" height="150" rx="40" fill="#BFE3FD"/>
  <text x="395" y="357" font-size="20" font-weight="700" fill="#1f1f1f" text-anchor="middle">1 Hash and look up</text>
  <text x="395" y="387" font-size="15" fill="#3a3a3a" text-anchor="middle">sha256(cookie value)</text>
  <text x="395" y="409" font-size="15" fill="#3a3a3a" text-anchor="middle">match sessions.token_hash</text>
  <text x="410" y="515" font-size="16" fill="#1f1f1f" text-anchor="start">find by hash</text>
  <circle cx="395" cy="640" r="78" fill="#E3CCFD"/>
  <text x="395" y="636" font-size="20" font-weight="700" fill="#1f1f1f" text-anchor="middle">sessions</text>
  <text x="395" y="660" font-size="14" fill="#3a3a3a" text-anchor="middle">one row per token</text>
  <rect x="600" y="310" width="270" height="130" rx="8" fill="#FFF1B8"/>
  <text x="735" y="357" font-size="20" font-weight="700" fill="#1f1f1f" text-anchor="middle">2 Still usable?</text>
  <text x="735" y="387" font-size="15" fill="#3a3a3a" text-anchor="middle">row exists, not expired,</text>
  <text x="735" y="409" font-size="15" fill="#3a3a3a" text-anchor="middle">revoked_at is empty</text>
  <text x="750" y="492" font-size="16" fill="#1f1f1f" text-anchor="start">no: 401 SESSION_REVOKED</text>
  <rect x="600" y="540" width="270" height="90" rx="6" fill="#FEC8C3"/>
  <text x="735" y="578" font-size="20" font-weight="700" fill="#1f1f1f" text-anchor="middle">Browser</text>
  <text x="735" y="608" font-size="15" fill="#3a3a3a" text-anchor="middle">back to the login page</text>
  <rect x="950" y="310" width="240" height="130" rx="8" fill="#FFF1B8"/>
  <text x="1070" y="357" font-size="20" font-weight="700" fill="#1f1f1f" text-anchor="middle">3 Already rotated?</text>
  <text x="1070" y="387" font-size="15" fill="#3a3a3a" text-anchor="middle">is rotated_at set on</text>
  <text x="1070" y="409" font-size="15" fill="#3a3a3a" text-anchor="middle">this row?</text>
  <text x="1262" y="260" font-size="16" font-weight="700" fill="#1f1f1f" text-anchor="middle">no</text>
  <text x="1262" y="640" font-size="16" font-weight="700" fill="#1f1f1f" text-anchor="middle">yes</text>
  <rect x="1290" y="120" width="330" height="140" rx="6" fill="#C9F2D6"/>
  <text x="1455" y="161" font-size="20" font-weight="700" fill="#1f1f1f" text-anchor="middle">4a Normal: rotate</text>
  <text x="1455" y="191" font-size="15" fill="#3a3a3a" text-anchor="middle">old row: rotated_at = now</text>
  <text x="1455" y="213" font-size="15" fill="#3a3a3a" text-anchor="middle">new row, same family_id</text>
  <text x="1455" y="235" font-size="15" fill="#3a3a3a" text-anchor="middle">new bm_at, bm_rt, bm_csrf</text>
  <circle cx="1455" cy="395" r="78" fill="#E3CCFD"/>
  <text x="1455" y="391" font-size="20" font-weight="700" fill="#1f1f1f" text-anchor="middle">sessions</text>
  <text x="1455" y="415" font-size="14" fill="#3a3a3a" text-anchor="middle">family of rows</text>
  <text x="1475" y="296" font-size="16" fill="#1f1f1f" text-anchor="start">insert + mark</text>
  <text x="1475" y="506" font-size="16" fill="#1f1f1f" text-anchor="start">revoke all</text>
  <rect x="1290" y="530" width="330" height="150" rx="48" fill="#BFE3FD"/>
  <text x="1455" y="576" font-size="20" font-weight="700" fill="#1f1f1f" text-anchor="middle">4b Reuse detected</text>
  <text x="1455" y="606" font-size="15" fill="#3a3a3a" text-anchor="middle">whole family revoked</text>
  <text x="1455" y="628" font-size="15" fill="#3a3a3a" text-anchor="middle">security alert mailed</text>
  <text x="1455" y="650" font-size="15" fill="#3a3a3a" text-anchor="middle">cookies cleared, 401</text>
</svg>
