<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 620" width="1440" height="620" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1440" height="620" fill="#ffffff"/>

  <!-- Title -->
  <text x="60" y="62" font-size="26" font-weight="700" fill="#000000">System overview (Level 0)</text>
  <text x="60" y="92" font-size="16" fill="#555555">Example of the clean style: short labels, no arrow text, details go in the explanation below the diagram.</text>

  <!-- Group: everything on the student's computer -->
  <rect x="300" y="130" width="840" height="430" rx="10" fill="#F2F2F2" stroke="#7F7F7F" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="322" y="160" font-size="15" font-weight="600" fill="#555555">Student's computer</text>

  <!-- Arrows first -->
  <path d="M262,225 H336" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M582,225 H646" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M892,225 H1196" stroke="#000000" stroke-width="2" fill="none" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
  <path d="M770,277 V340" stroke="#000000" stroke-width="2" fill="none"/>
  <path d="M530,340 H1010" stroke="#000000" stroke-width="2" fill="none"/>
  <path d="M530,340 V406" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M770,340 V406" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M1010,340 V406" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Shapes -->
  <rect x="60" y="175" width="200" height="100" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="160" y="232" font-size="22" text-anchor="middle" fill="#000000">Student</text>

  <rect x="340" y="175" width="240" height="100" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="460" y="232" font-size="22" text-anchor="middle" fill="#000000">Desktop app</text>

  <rect x="650" y="175" width="240" height="100" rx="10" fill="#000000" stroke="#000000" stroke-width="2"/>
  <text x="770" y="232" font-size="22" font-weight="700" text-anchor="middle" fill="#ffffff">Backend API</text>

  <rect x="1200" y="175" width="180" height="100" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="1290" y="232" font-size="22" text-anchor="middle" fill="#000000">AI provider</text>

  <rect x="425" y="410" width="210" height="100" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="530" y="467" font-size="22" text-anchor="middle" fill="#000000">App database</text>

  <rect x="665" y="410" width="210" height="100" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="770" y="467" font-size="22" text-anchor="middle" fill="#000000">Study database</text>

  <rect x="905" y="410" width="210" height="100" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="1010" y="467" font-size="22" text-anchor="middle" fill="#000000">File storage</text>
</svg>
